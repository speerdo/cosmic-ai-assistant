[package]
name = "cosmo-stt"
description = "Speech to text via sherpa-onnx: streaming + offline models with hotword biasing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# sherpa-onnx and the native ONNX Runtime it brings. Feature-gated so the
# core CI tier builds without it (two-tier rule, phase-2 findings §1g).
sherpa = ["dep:sherpa-onnx"]

[[example]]
name = "link_sherpa"
required-features = ["sherpa"]

[[example]]
name = "vad_segments"
required-features = ["sherpa"]

[[test]]
name = "vad_cuts"
required-features = ["sherpa"]

[[example]]
name = "bench_wake"
required-features = ["sherpa"]

[[example]]
name = "transcribe"
required-features = ["sherpa"]

[[test]]
name = "session"
required-features = ["sherpa"]

[dependencies]
sherpa-onnx = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
# `sync` only, as in cosmo-audio: results are awaitable from the daemon's
# runtime or blocked on from a thread. No runtime is started here.
tokio = { workspace = true, features = ["sync"] }
# Core tier only (no PipeWire): the segmenter's pause rules.
cosmo-audio.workspace = true
cosmo-config.workspace = true

[dev-dependencies]
hound.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
