[package]
name = "cosmo-daemon"
description = "The cosmo daemon: the state machine that owns the microphone, hotkey, models, and tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time", "fs"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
cosmo-ipc.workspace = true
cosmo-gate.workspace = true
cosmo-config.workspace = true
cosmo-mcp.workspace = true
cosmo-tools.workspace = true
cosmo-reason.workspace = true
cosmo-tts.workspace = true
# Always a dependency: `Clip`, `Outcome` and `AudioError` are native-free.
# Only the `speech` feature pulls in PipeWire.
cosmo-audio.workspace = true
cosmo-stt.workspace = true
# Core tier: evdev through ioctls, inotify for hotplug; no native library.
cosmo-hotkey.workspace = true
# Focused app_id for per-app hotwords (Wayland only, no native library).
cosmo-focus.workspace = true
cosmo-reflex.workspace = true
zbus.workspace = true

[dev-dependencies]
hound.workspace = true

[features]
# The voice layer: the native PipeWire player and the local Kokoro provider
# (onnxruntime). Off by default so the core CI tier builds without either
# (two-tier decision, phase-2 findings §1g). Build the daemon you run with:
#   scripts/fetch-native   # once: the shared ONNX Runtime (phase-3 §1)
#   cargo build --release -p cosmo-daemon --features speech
speech = ["cosmo-audio/pipewire-backend", "cosmo-tts/kokoro"]
# Speech recognition (phase 3): sherpa-onnx and its native ONNX Runtime.
# Needs `speech`: capture is the same PipeWire backend, and half-duplex
# reads playback's gate.
ears = ["speech", "cosmo-stt/sherpa"]

[[test]]
name = "ears"
required-features = ["ears"]

[[example]]
name = "bench_reflex"
required-features = ["speech", "ears"]

[[example]]
name = "bench_asr"
required-features = ["speech", "ears"]

[[example]]
name = "link_asr_tts"
required-features = ["speech", "ears"]

[[bin]]
name = "cosmod"
path = "src/main.rs"
