[package]
name = "cosmo-applet"
description = "COSMIC panel applet: thin libcosmic client over the control socket"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "cosmo-applet"
path = "src/main.rs"

[dependencies]
libcosmic = { workspace = true, features = ["applet", "tokio", "wayland"] }
cosmo-ipc = { workspace = true, features = ["client"] }
futures.workspace = true
