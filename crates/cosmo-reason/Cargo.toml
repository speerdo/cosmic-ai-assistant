[package]
name = "cosmo-reason"
description = "Reasoning path: chat-completions client (v1), Realtime API websocket text-out (v2)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
futures.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
oo7.workspace = true
cosmo-config.workspace = true
cosmo-gate.workspace = true
# Browser sign-in (login.rs): PKCE's S256 challenge and random values.
# All three were already in the dependency graph (MIT OR Apache-2.0).
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
