[package]
name = "cosmo-tools"
description = "Native tools: tmux terminal control, announce, remember, system_query, clipboard, MPRIS media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["process", "time", "fs", "sync", "macros", "io-util", "rt", "net"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
cosmo-config.workspace = true
cosmo-gate.workspace = true
wl-clipboard-rs.workspace = true
# MPRIS media control (media.rs).
zbus.workspace = true
# Core tier (no `sherpa`): the `.desktop` reader `launch_app` resolves ids with.
cosmo-stt.workspace = true
# Weather and place lookups (weather.rs, geo.rs). Both already in the graph.
reqwest = { workspace = true, features = ["json", "query"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# RSS/Atom (news.rs). Already in the graph (wayland-scanner), MIT.
quick-xml = "0.41"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }