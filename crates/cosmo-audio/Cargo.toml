[package]
name = "cosmo-audio"
description = "Native PipeWire client: pre-roll ring buffer, VAD segment cuts, half-duplex gating, playback"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[example]]
name = "link_pipewire"
required-features = ["pipewire-backend"]

[[example]]
name = "play_sine"
required-features = ["pipewire-backend"]

[[example]]
name = "play_wav"
required-features = ["pipewire-backend"]

[[example]]
name = "record"
required-features = ["pipewire-backend"]

[lints]
workspace = true

[features]
# The native PipeWire backend. Feature-gated so the workspace's core tier
# builds on a machine without libpipewire-0.3-dev (CI two-tier, spec §2.1).
pipewire-backend = ["dep:pipewire"]

[dependencies]
# `v0_3_49` exposes `Buffer::requested()`, so a process call writes what
# the graph asked for rather than a whole (latency-adding) buffer.
pipewire = { workspace = true, optional = true, features = ["v0_3_49"] }
thiserror.workspace = true
tracing.workspace = true
# `sync` only: completion handles are oneshots, awaitable from the daemon's
# runtime or blocked on from a plain thread. No runtime is started here.
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
hound.workspace = true
