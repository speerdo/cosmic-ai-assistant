[package]
name = "cosmo-ipc"
description = "Control-socket protocol types shared by the cosmo daemon, CLI, applet, and overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The overlay's and applet's client (client.rs): tokio, no daemon code.
client = ["dep:tokio", "dep:thiserror"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true, features = ["net", "io-util", "sync", "time", "rt", "macros"] }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
