# cargo-about policy for the `cosmo` package (daemon, CLI, overlay): the
# licences a crate linked into them may carry. GPL is deliberately absent:
# a GPL crate reaching these binaries fails `packaging/gen-licenses`.
# THIRD_PARTY.md explains each choice.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    # The fonts libcosmic embeds (Open Sans, Noto Sans Mono): embedding is
    # allowed, with the licence carried alongside.
    "OFL-1.1",
]
targets = ["x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Git dependencies whose crate directory names no licence: each is
# clarified from its repository's root licence file, pinned by checksum, so
# a relicensing upstream fails generation instead of passing silently.
# (Checked 2026-10-04 against the revisions in Cargo.lock.)
# libcosmic's own tree also holds CC-BY-SA-4.0 icons (cosmic-icons/), but
# its build.rs embeds them only for non-unix targets; on Linux the binary
# carries its MPL-2.0 code and two OFL-1.1 fonts (res/, include_bytes!).
[libcosmic.clarify]
license = "MPL-2.0 AND OFL-1.1"
[[libcosmic.clarify.git]]
path = "LICENSE"
checksum = "1f256ecad192880510e84ad60474eab7589218784b9a50bc7ceee34c2b91f1d5"
[[libcosmic.clarify.git]]
path = "res/open-sans/LICENSE"
checksum = "87a330d2f56cfe470431eed7996fa5423f694c79e2ad7c4c515ac75bc9a340d6"
[[libcosmic.clarify.git]]
path = "res/noto/LICENSE"
checksum = "6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2"

