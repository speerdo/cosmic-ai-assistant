[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/speerdo/cosmic-ai-assistant"

[workspace.dependencies]
# Async runtime / streams
tokio = "1.53"
futures = "0.3"

# Config / serialization
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"
# WAV encode/decode for the phrase cache (pure Rust, no native build).
hound = "3.5"

# Errors / logging
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# FFI / JSON
libc = "0.2"
serde_json = "1"
# memfd for virtual-keyboard keymap upload (cosmo-type)
rustix = "1.1"

# MCP host (no default features: we are a client only; server features are
# pulled in explicitly if ever needed)
rmcp = { version = "3.3", default-features = false }

# Reasoning path
reqwest = "0.13"
tokio-tungstenite = "0.30"

# ONNX runtime and models
# default-features off to swap ort's default `tls-native` for `tls-rustls`:
# the binary download is the only thing TLS is for here, and native-tls
# would add libssl-dev to the system package list for nothing (§2.1).
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "download-binaries",
    "tls-rustls",
] }
sherpa-onnx = "1.13"
# No Kokoro crate is declared here on purpose — see findings §1. `koko` on
# crates.io is an unrelated self-hosting tool, `kokoros` is not published at
# all, and the two real candidates each cost something §2.5 has to weigh.
# Declaring one before it is resolved is the mistake `koko = "0.2"` was.

# Audio (native PipeWire client, RT data-loop)
pipewire = "0.10"

# Input
evdev = "0.13"
udev = "0.9"
xkbcommon = "0.9"

# Wayland / COSMIC
wayland-client = "0.31"
wayland-protocols = { version = "0.32", default-features = false }
wayland-protocols-wlr = { version = "0.3", default-features = false }
# xkbcommon/calloop off by default: the overlay needs neither (no keyboard
# interactivity, blocking_dispatch loop). Re-enable per-crate when needed.
smithay-client-toolkit = { version = "0.21", default-features = false }
wayland-protocols-misc = "0.3"
cosmic-protocols = "0.2"
cosmic-text = "0.19"
tiny-skia = "0.12"
# libcosmic is not published to crates.io; tracked from git.
libcosmic = { git = "https://github.com/pop-os/libcosmic" }

# Desktop services
zbus = "5.19"
wl-clipboard-rs = "0.9"
# Secret Service client for the API key (pure Rust on zbus — deliberately not
# libsecret, to keep the packaging story a single static-ish binary).
# See implementation-plan.md §1.4.
oo7 = "0.6"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Internal crates
cosmo-ipc = { path = "crates/cosmo-ipc" }
cosmo-config = { path = "crates/cosmo-config" }
cosmo-focus = { path = "crates/cosmo-focus" }
cosmo-hotkey = { path = "crates/cosmo-hotkey" }
cosmo-audio = { path = "crates/cosmo-audio" }
cosmo-stt = { path = "crates/cosmo-stt" }
cosmo-tts = { path = "crates/cosmo-tts" }
cosmo-mcp = { path = "crates/cosmo-mcp" }
cosmo-type = { path = "crates/cosmo-type" }
cosmo-reflex = { path = "crates/cosmo-reflex" }
cosmo-reason = { path = "crates/cosmo-reason" }
cosmo-gate = { path = "crates/cosmo-gate" }
cosmo-tools = { path = "crates/cosmo-tools" }
cosmo-daemon = { path = "crates/cosmo-daemon" }
cosmo-overlay = { path = "crates/cosmo-overlay" }
cosmo-applet = { path = "crates/cosmo-applet" }
cosmo-cli = { path = "crates/cosmo-cli" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
